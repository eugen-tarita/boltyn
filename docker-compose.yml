version: "3.8"

services:
  # ── Ollama (KI-Modell-Server) ──
  ollama:
    image: ollama/ollama:latest
    container_name: boltyn-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Für GPU-Unterstützung (optional, z.B. NVIDIA auf NAS):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── BOLTYN Python-Server ──
  boltyn:
    build: .
    container_name: boltyn-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:32b
      - EMBED_MODEL=nomic-embed-text
      - CHROMA_DB_PATH=/data/chroma_db
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
    volumes:
      - boltyn_data:/data
      - ./docs:/app/docs
    depends_on:
      - ollama

volumes:
  ollama_data:
  boltyn_data:
